ary><ol><li><strong>Define who and where to reach.</strong> Agree eligibility, an initial pilot area and expansion across the six geopolitical zones. Monitor state, rural and urban coverage, gender and access needs. Nationwide reach is the goal; coverage must be demonstrated.</li><li><strong>Use adaptive snowball recruitment.</strong> Seek varied starting contacts through disability organisations, community groups and training centres, including Gufwan’s networks where agreed. Referrals should share invitations, not another person’s private details. Review coverage and referral yield weekly; add new contacts and assisted, in-person or accessible remote registration where gaps persist. Agree review triggers during the pilot and log each adaptation. Continue looking beyond referral networks for isolated people.</li><li><strong>Build and maintain the database.</strong> Explain use and consent; collect only necessary contact, location, learning and support information. Separate optional research consent, check duplicates, restrict access and provide correction and withdrawal routes. Pilot accessible questions with people with disabilities; use suitable <a href="https://www.washingtongroup-disability.com/implementation/implementation-guidelines/">Washington Group tools</a> for research on functioning, alongside separate questions about learning support.</li><li><strong>Recruit facilitators and connect learning.</strong> Review subject knowledge, online teaching and accessibility skills. Record availability, languages and capacity, then match learners by goals and support requirements. Identify device, connectivity and accommodation barriers before lessons begin.</li><li><strong>Select a separate research sample.</strong> Define the study question and the population a usable sampling list covers. Where feasible, randomly select within agreed groups. Calculate sample size from required precision, subgroup reporting, design effects, expected non-response and budget. Record selection probabilities and response outcomes for weighting. Registry-based results describe its covered population; national estimates need a suitable national sampling frame. <a href="https://www.worldbank.org/en/programs/lsms/sampling">World Bank sampling guidance</a> informs this design.</li><li><strong>Follow up and improve coverage.</strong> Track registrations, matches, attendance, completion and unresolved support needs. Check who drops out or remains unreached, and adapt outreach. Report missing data and research uncertainty. Referral counts, statistical weights or Bayesian models alone cannot establish national representativeness.</li></ol></details><section class="sampling-statistics"><h2>Proposed measures of success.</h2><p>Every measure below is proposed for agreement during scoping. No results, budget amounts or performance targets are available. These describe delivery and coverage, without establishing causal impact.</p><div class="sampling-table-scroll" role="region" aria-label="Proposed pilot measurements" tabindex="0"><table class="sampling-methods"><caption>Proposed definitions and collection frequency</caption><thead><tr><th scope="col">Proposed measure</th><th scope="col">Definition</th><th scope="col">Collection and review frequency</th></tr></thead><tbody><tr><th scope="row">Proposed registration quality</th><td>Count unique registrations meeting agreed verification checks. Report suspected duplicates awaiting review separately; do not count unresolved duplicates as verified.</td><td>Check daily during collection; summarise weekly.</td></tr><tr><th scope="row">Proposed recruitment coverage</th><td>Count recruitment by channel and agreed participant group. Show missing location and profile fields as counts and shares of all registrations; retain unknown categories. Multi-channel totals must identify overlaps.</td><td>Review weekly, with a dated outreach-change log.</td></tr><tr><th scope="row">Proposed teaching pathway</th><td>Count unique learners requesting teaching, matched, waiting for a suitable match, and starting at least one instructional session. State the observation date and cohort; these stages are not additive.</td><td>Update at each transition; summarise weekly.</td></tr><tr><th scope="row">Proposed attendance and skills</th><td>Attendance = sessions attended / sessions scheduled for each starting cohort. Skills = learners demonstrating an agreed assessed skill / all learners starting that cohort. Report numerator, denominator, assessment criteria and unassessed learners; completion review requires a full course cycle.</td><td>Record each session and assessment; review monthly and at course-cycle end.</td></tr><tr><th scope="row">Proposed follow-up and access</th><td>Missing follow-ups / all follow-ups due in the period; unresolved access needs / all recorded needs. Summarise voluntary feedback, number invited, number responding and themes, with accessible response routes.</td><td>Log as received; review weekly and at cohort follow-up.</td></tr><tr><th scope="row">Proposed unit costs</th><td>Document actual attributable costs and allocation rules for the same period/cohort. Divide by verified registrations, learners starting instruction, and learners demonstrating an agreed skill, respectively. Show each numerator and denominator; a zero denominator means not calculable.</td><td>Record expenditure when incurred; reconcile monthly and at pilot review.</td></tr></tbody></table></div><p>Proposed evidence outputs: a checked register with a duplicate-review log; recruitment and coverage summaries with an outreach-change log; learner matching and waiting lists; cohort attendance and skills summaries; and a review of access barriers, participant feedback and costs. Share only agreed aggregate reporting, with small-group disclosure risks reviewed.</p></section><section><h2>Resources and preparation before recruitment.</h2><p>This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p><ol><li>Co-design questions, consent and learning arrangements with people with disabilities.</li><li>Review existing data tools and discuss possible NDMIS alignment with the responsible technical team; agree definitions, permissions and stewardship before any data sharing.</li><li>Assess facilitator capacity, languages, devices, connectivity and accommodation barriers.</li><li>Obtain local cost estimates for outreach, staffing, teaching, infrastructure and access support.</li><li>Agree responsibilities, readiness criteria and a limited pilot protocol before recruitment.</li></ol><p>Agree who provides each resource and who owns collection, safeguarding, teaching and follow-up. A working demonstration does not establish operational readiness.</p></section><section class="proposal-sources"><h2>Sources and review dates.</h2><p>Historical achievements, reported priorities and our proposed activities are distinguished above. Methodological sources inform the proposal; they do not endorse it.</p><ul><li><a href="https://www.afro.who.int/news/neglect-inspiration-ayuba-gufwans-story">WHO: From neglect to inspiration</a> · 23 April 2019 · Reviewed 8 November 2026. <span>Historical profile of Gufwan’s mobility advocacy and education pathway.</span></li><li><a href="https://www.beautifulgatewheelchairs.org/">Beautiful Gate’s own account</a> · Undated · Reviewed 8 November 2026. <span>Organisation-reported cumulative reach; the page does not date the totals.</span></li><li><a href="https://www.crcna.org/news-and-events/news/entering-through-beautiful-gate">World Renew: Entering through the Beautiful Gate</a> · 22 November 2017 · Reviewed 8 November 2026. <span>Historical account of wheelchair production and outreach.</span></li><li><a href="https://www.thecable.ng/interview-why-we-proposed-allocating-10-of-government-interventions-to-pwds-by-ayuba-gufwan/">TheCable: Interview with Ayuba Gufwan</a> · 15 November 2025 · Reviewed 8 November 2026. <span>Gufwan’s stated priorities and initiatives, attributed to the interview.</span></li><li><a href="https://inclusivenews.com.ng/credible-disability-data-key-to-effective-planning-service-delivery-gufwan/">Inclusive News Network: Disability data and NDMIS workshop</a> · 4 November 2026 · Reviewed 8 November 2026. <span>Reporting on validation of revised KPIs and NDMIS data collection tools; does not verify deployment or this project’s integration.</span></li><li><a href="https://unhcr.github.io/Integrated-framework-household-survey/Sampling.html">UNHCR: Sampling</a> · Online guidance · Reviewed 8 November 2026. <span>Probability and non-probability approaches, including referral bias.</span></li><li><a href="https://www.worldbank.org/en/programs/lsms/sampling">World Bank: Sampling, Weighting &amp; Estimation</a> · Online guidance · Reviewed 8 November 2026. <span>Guidance for a justified survey design and inference.</span></li><li><a href="https://worldbank.github.io/dime-data-handbook/acquisition.html">DIME: Acquiring development data</a> · Online handbook · Reviewed 8 November 2026. <span>Data quality, documentation and confidential-data handling.</span></li><li><a href="https://www.washingtongroup-disability.com/implementation/implementation-guidelines/">Washington Group: Implementation guidelines</a> · Online guidance · Reviewed 8 November 2026. <span>Question selection and implementation for disability statistics.</span></li></ul></section></section></div></section>

<section id="static-about"><link rel="preload" as="image" href="/photos/cocreator-jerry-bannister-zachary.webp"/><link rel="preload" as="image" href="/photos/cocreator-strong-yusuf-mashat.webp"/><div class="showcase about-page"><section class="section public-page"><div class="site-page-heading"><div><h2>About.</h2><p>Two statisticians proposing a pathway from reliable data to accessible teaching.</p></div></div><section class="about-creators" aria-labelledby="about-creators-title"><h2 id="about-creators-title">The co-creators</h2><p class="about-creators-intro">Jerry and Strong created Impact Mosaic together and have co-authored a research paper.</p><div class="about-creators-grid"><article class="about-creator" aria-labelledby="creator-jerry"><img src="/photos/cocreator-jerry-bannister-zachary.webp" alt="Jerry Bannister Zachary, seated in a wheelchair, wearing a purple kaftan and purple trainers." width="720" height="1000" decoding="async"/><div><h3 id="creator-jerry">Jerry Bannister Zachary</h3><p class="about-creator-role">Statistician and data scientist · Co-creator</p><p>Jerry is a data scientist and wheelchair user who works as a statistician at the Directorate of Academic Planning and Quality Assurance, Abubakar Tafawa Balewa University (ATBU), Bauchi.</p><p>Jerry has consistently finished in the top 2 percent of the class in Statistics, at both bachelor’s and master’s level, won the MTN Foundation (MTNF) Scholarship award as an undergraduate, and is now studying for a PhD. Jerry is a member of the Chartered Institute of Statisticians of Nigeria (CISON).</p><p>Jerry has authored papers across health, science and the social sciences, and founded JJMB Datascience Hub, a statistical consultancy for researchers, non-governmental organisations and businesses.</p><p>Living with disability shapes the work. Jerry’s disability research includes a <a href="https://github.com/batestguy/NGOdisabilityRAG" target="_blank" rel="noreferrer">disability rights assistant<span class="sr-only"> (opens in a new tab)</span></a>: a chatbot that answers questions about Nigeria’s Disability Act 2018 and the Constitution, using retrieval-augmented generation (RAG) so that each answer draws on the legal texts themselves.</p><p>To connect with Jerry, read the research on <a href="https://scholar.google.com/citations?user=oKaejtMAAAAJ" target="_blank" rel="noreferrer">Google Scholar<span class="sr-only"> (opens in a new tab)</span></a> and <a href="https://zenodo.org/search?q=metadata.creators.person_or_org.name%3A%22Zachary%2C%20Jerry%22%20OR%20metadata.creators.person_or_org.name%3A%22Zachary%2C%20Jerry%20Bannister%22%20OR%20metadata.creators.person_or_org.identifiers.identifier%3A%220009-0002-3302-9558%22" target="_blank" rel="noreferrer">Zenodo<span class="sr-only"> (opens in a new tab)</span></a>, browse the code and projects on <a href="https://github.com/batestguy" target="_blank" rel="noreferrer">GitHub<span class="sr-only"> (opens in a new tab)</span></a>, or challenge Jerry to a game of chess as bayesianRules on <a href="https://www.chess.com/member/bayesianRules" target="_blank" rel="noreferrer">Chess.com<span class="sr-only"> (opens in a new tab)</span></a> or <a href="https://lichess.org/@/bayesianRules" target="_blank" rel="noreferrer">Lichess<span class="sr-only"> (opens in a new tab)</span></a>.</p></div></article><article class="about-creator" aria-labelledby="creator-strong"><img src="/photos/cocreator-strong-yusuf-mashat.webp" alt="Yusuf Strong Mashat, head and shoulders, in a navy suit and tie." width="720" height="926" decoding="async"/><div><h3 id="creator-strong">Yusuf Strong Mashat</h3><p class="about-creator-role">Statistician and lecturer · Co-creator</p><p>Strong is a statistician from Bokkos, Plateau State, and lectures in Statistics at Plateau State University, Bokkos. Before that, Strong taught for six years at the Plateau State College of Health Technology, Pankshin, serving as Acting Dean of its School of Health Information Management and Biostatistics.</p><p>Strong finished in the top 2 percent of the MSc Statistics class at Abubakar Tafawa Balewa University (ATBU), Bauchi, and has won the prestigious Petroleum Technology Development Fund (PTDF) PhD scholarship. Strong is a member of the Royal Statistical Society (RSS) and the Chartered Institute of Statisticians of Nigeria (CISON).</p><p>Strong’s teaching covers sampling, survey design and biostatistics, with census fieldwork for the National Population Commission as an enumerator in 2006 and a trainer of census staff in 2023. For this project, Strong brings sampling design, data quality and evaluation.</p><p>To connect with Strong, follow the research on <a href="https://www.researchgate.net/profile/Strong-Mashat" target="_blank" rel="noreferrer">ResearchGate<span class="sr-only"> (opens in a new tab)</span></a>.</p><p>Strong is happily married with children.</p></div></article></div></section><div class="about-overview"><section><h2>About Impact Mosaic</h2><p>Impact Mosaic brings together a source-linked showcase of disability inclusion and a <a href="/?page=explore">Learning Sandbox</a> that shows how learners, facilitators and Administration would work together.</p><p>The starting location for a limited pilot will be agreed with partners. Exact communities, eligibility, participant numbers and courses will be agreed during technical scoping.</p><p>The showcase is independent. The sandbox uses fictional participants and sample records only.</p></section><section><h2>Proposed statistical responsibilities</h2><p>Recruitment design, data quality checks, coverage monitoring and evaluation: agree who to reach, check records, identify missing groups and follow starting cohorts with explicit denominators.</p><p>This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p></section></div><section class="about-contact" aria-labelledby="about-contact-title"><h2 id="about-contact-title">Get in touch</h2><p>To discuss the proposal, contact either co-creator directly.</p><div class="about-contact-grid"><div><h3>Jerry Bannister Zachary</h3><ul><li>Email: <a href="mailto:batesthommie@gmail.com">batesthommie@gmail.com</a></li><li>Email: <a href="mailto:jzbannister@atbu.edu.ng">jzbannister@atbu.edu.ng</a></li><li>Phone: <a href="tel:+2347061674831">+234 706 167 4831</a></li></ul></div><div><h3>Yusuf Strong Mashat</h3><ul><li>Email: <a href="mailto:bwehlak61@gmail.com">bwehlak61@gmail.com</a></li><li>Phone: <a href="tel:+2348030478249">+234 803 047 8249</a></li></ul></div></div></section></section></div></section><footer><a href="https://deerflow.tech" target="_blank" rel="noreferrer">Created By Deerflow</a></footer></main></noscript><!-- static-story:end -->
