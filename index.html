<nav aria-label="Main navigation"><a href="#static-home">Home</a> &middot; <a href="#static-explore">Learning Sandbox</a> &middot; <a href="#static-research">Research &amp; Data Collection</a> &middot; <a href="#static-about">About</a></nav><section id="static-home"><p>IMPACT MOSAIC / DISABILITY INCLUSION</p><h1>Building a more inclusive Nigeria.</h1>
<p>Chief Ayuba Gufwan, Executive Secretary of the National Commission for Persons with Disabilities (NCPWD).</p>
<p>An independent, source-linked showcase. The learning sandbox requires JavaScript; the documented story and downloads remain available below.</p>
<section class="section pilot-proposal" aria-labelledby="home-proposal-heading"><p class="eyebrow">AN INDEPENDENT PROPOSAL · PLATEAU FIRST</p><h2 id="home-proposal-heading">Building on this foundation.</h2><p class="lead">Two statisticians helping build a reliable database of people with disabilities and connect participants to accessible online teaching, building on Gufwan’s foundation.</p><p>Voluntary registration would help us understand learning interests and access needs, then match willing learners with reviewed online facilitators and follow up on participation and skills.</p><p>Plateau is our proposed starting location for a limited pilot. Exact communities, eligibility, participant numbers and courses will be agreed during technical scoping.</p><p>Our immediate request is a technical discussion, community introductions and agreement on pilot-scoping requirements.</p><p class="proposal-links"><a href="/?page=research-reading#static-research">Read the research plan →</a> <a href="/downloads/plateau-pilot-discussion-brief.html">Plateau Pilot Discussion Brief →</a> <a href="/?page=explore#static-explore">Explore the learning sandbox →</a></p><p class="sampling-source-note">This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p></section><figure><a href="/photos/noa.webp"><img src="/photos/noa.webp" alt="Ayuba Gufwan and Lanre Issa-Onilu seated together, shaking hands at the NOA engagement." width="950" height="633" loading="lazy"></a><figcaption>Chief Ayuba Gufwan and NOA Director-General Lanre Issa-Onilu at an inclusion engagement.<p>NOA headquarters, Abuja · Report: 2025-12-10 · <a href="https://fmino.gov.ng/ncpwd-strengthens-collaboration-with-national-orientation-agency-to-deepen-national-disability-inclusion/">Photograph published by FMINO</a></p></figcaption></figure><h2>Chief Ayuba Gufwan.</h2><p>Appointed on 6 August 2024, Gufwan brings a background in law and disability advocacy. FMINO's leadership profile describes more than three decades of advocacy and an approach built on development partnerships.</p><a href="https://fmino.gov.ng/championing-inclusion-chief-ayuba-gufwans-mission-for-persons-with-disabilities-in-nigeria/">Read the leadership profile</a><h3>More of his story.</h3><ul><li><a href="https://www.afro.who.int/news/neglect-inspiration-ayuba-gufwans-story">WHO: From neglect to inspiration</a><p>WHO profiles Gufwan as a polio survivor, mobility advocate and vaccine champion. A historical account of his work before his NCPWD appointment.</p></li><li><a href="https://www.rotarywheelsofhope.org/blog/who-is-ayuba/">Wheels of Hope: Who is Ayuba?</a><p>A partner account of his education, Beautiful Gate and locally built mobility devices. Partner-reported history and totals are not independently verified here.</p></li><li><a href="https://www.beautifulgatewheelchairs.org/">Beautiful Gate: the organisation?s story</a><p>Beautiful Gate describes the mobility workshop in Jos and its origins with Ayuba Gufwan and Ron Rice. This is the organisation?s own account.</p></li><li><a href="https://www.thecable.ng/interview-why-we-proposed-allocating-10-of-government-interventions-to-pwds-by-ayuba-gufwan/">TheCable: Gufwan on inclusion and public priorities</a><p>A first-person interview on education, accessibility, disability data and the Commission?s priorities. Statements and proposed initiatives remain attributed to the interview.</p></li></ul><figure><a href="/photos/leadership.webp"><img src="/photos/leadership.webp" alt="Chief Ayuba Gufwan seated at a table, speaking into a microphone." width="696" height="464" loading="lazy"></a><figcaption>Chief Ayuba Gufwan, in the photograph published with FMINO’s leadership profile.<p>Nigeria; photograph venue not specified · Report: 2024-10-26 · <a href="https://fmino.gov.ng/championing-inclusion-chief-ayuba-gufwans-mission-for-persons-with-disabilities-in-nigeria/">Photograph published by FMINO</a></p></figcaption></figure>
<h2>Participation, in practice.</h2><article id="static-mobility"><h3>1. Mobility and participation</h3><p>Reported delivery · Otukpo, Benue State · Report: 2025-10-11</p><figure><a href="/photos/mobility-2.webp"><img src="/photos/mobility-2.webp" alt="Rows of colourful three-wheeled mobility devices arranged at the Otukpo activity." width="1024" height="683" loading="lazy"></a><figcaption>Tricycles pictured in the mobility-support report, delivered through a partnership with Beautiful Gate and Senator Abba Moro.<p>Otukpo, Benue State · Report: 2025-10-11 · <a href="https://qualitativemagazine.com/ncpwd-beautiful-gate-foundation-senator-abba-moro-empower-pwds-in-benue-with-thousands-of-tricycles-and-assistive-devices/">Photograph published by The Qualitative Magazine</a></p></figcaption></figure><p>A joint mobility-support activity brought tricycles and assistive devices to persons with disabilities in Otukpo.</p><p><b>Gufwan / NCPWD's role:</b> NCPWD participated in the partnership. Gufwan spoke at the event and commended the collaborators.</p><p><b>Partner credit:</b> Beautiful Gate Handicapped People Center and Senator Abba Moro.</p><p><b>Evidence and activity status:</b> The media report describes distribution. Recipient totals, sustained device use and economic outcomes have not been independently verified here.</p><a href="https://qualitativemagazine.com/ncpwd-beautiful-gate-foundation-senator-abba-moro-empower-pwds-in-benue-with-thousands-of-tricycles-and-assistive-devices/">Read source</a></article><article id="static-livelihoods"><h3>2. Skills and livelihoods</h3><p>Reported delivery · Nigeria; distribution venue not specified · Report: 2025-07-07</p><figure><a href="/photos/farm.webp"><img src="/photos/farm.webp" alt="Participants, including wheelchair users, beside fertilizer sacks and boxes at the agricultural-support activity." width="950" height="633" loading="lazy"></a><figcaption>Participants at the Commission’s agricultural-support distribution.<p>Nigeria; venue not specified in report · Report: 2025-07-07 · <a href="https://fmino.gov.ng/empowering-persons-with-disabilities-in-agriculture-ncpwd-distributes-fertilizers-and-farming-tools/">Photograph published by FMINO</a></p></figcaption></figure><p>The Commission reported distributing fertilizers and basic farming tools to participants organised through disability associations.</p><p><b>Gufwan / NCPWD's role:</b> Lawrence Idemudia represented the Executive Secretary at the distribution. The wider skills agenda includes an announced Amnesty International collaboration.</p><p><b>Partner credit:</b> Participating disability associations, including JONAPWD, the Nigerian Association of the Blind and the Nigerian National Association of the Deaf.</p><p><b>Evidence and activity status:</b> Published 7 July 2025; the body states 7 June and an inconsistent weekday, so the activity date remains uncertain. No yield or income improvement is established. The separate November skills partnership is proposed collaboration, not completed training.</p><a href="https://fmino.gov.ng/empowering-persons-with-disabilities-in-agriculture-ncpwd-distributes-fertilizers-and-farming-tools/">Read source</a><p><a href="https://fmino.gov.ng/ncpwd-amnesty-international-to-collaborate-on-skills-acquisition-inclusion-programs-for-persons-with-disabilities/">Skills partnership report</a></p></article><article id="static-education"><h3>3. Inclusive education</h3><p>Advocacy and discussion · UBEC, Abuja · Report: 2024-09-26</p><figure><a href="/photos/education-2.webp"><img src="/photos/education-2.webp" alt="Gufwan, seated on the right, speaking across a meeting table with a UBEC official." width="950" height="633" loading="lazy"></a><figcaption>Gufwan during the UBEC partnership discussion on inclusive education.<p>UBEC, Abuja · Report: 2024-09-26 · <a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Photograph published by FMINO</a></p></figcaption></figure><p>At UBEC, Gufwan called for learning materials, assistive devices and better access to education for children with disabilities, including girls.</p><p><b>Gufwan / NCPWD's role:</b> Gufwan participated in the courtesy visit and advocated for collaboration and support for rural communities.</p><p><b>Partner credit:</b> Universal Basic Education Commission and its special-needs team.</p><p><b>Evidence and activity status:</b> The report documents advocacy and partnership discussion. It does not establish that NCPWD provided the proposed materials, opened schools or achieved educational outcomes.</p><a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Read source</a></article><article id="static-civic"><h3>4. Civic participation</h3><p>Delivered engagement · Abuja / Edo and Kwara monitoring · Report: 2024-09-21</p><figure><a href="/photos/civic.webp"><img src="/photos/civic.webp" alt="Chief Ayuba Gufwan holding a microphone and gesturing with an open hand." width="696" height="464" loading="lazy"></a><figcaption>Gufwan speaking during election monitoring at the Commission’s situation room.<p>NCPWD headquarters, Abuja · Report: 2024-09-21 · <a href="https://fmino.gov.ng/persons-with-disabilities-franchise-can-never-be-undermined-gufwan/">Photograph published by FMINO</a></p></figcaption></figure><p>The Commission’s situation room monitored participation in the Edo governorship and Kwara local elections. Gufwan spoke to journalists about voting rights.</p><p><b>Gufwan / NCPWD's role:</b> Gufwan personally addressed the monitoring activity. NCPWD’s disability desk reported both access support and unresolved barriers.</p><p><b>Partner credit:</b> NSCDC disability desk officers; INEC was discussed in the report.</p><p><b>Evidence and activity status:</b> A polling-unit access barrier in Edo required assistance. Violence in one Kwara ward was also reported. Monitoring and reported assistance do not establish universal access or nationwide voting outcomes.</p><a href="https://fmino.gov.ng/persons-with-disabilities-franchise-can-never-be-undermined-gufwan/">Read source</a></article><article id="static-communities"><h3>5. Services closer to communities</h3><p>Announced plan · Abia State / Southeast Nigeria · Report: 2025-01-19</p><figure><a href="/photos/abia.webp"><img src="/photos/abia.webp" alt="Governor Alex Otti holding a microphone beside a seated woman at the Abia partner engagement." width="950" height="634" loading="lazy"></a><figcaption>Governor Alex Otti at the partner engagement covered in the regional-access report. Gufwan is not pictured in this frame.<p>Abia State · Report: 2025-01-19 · <a href="https://fmino.gov.ng/gufwan-takes-governor-otti-as-champion-of-the-disabilities-community-in-nigeria/">Photograph published by FMINO</a></p></figcaption></figure><p>During a working visit to Abia, Gufwan advocated for a Southeast zonal office to make the Commission easier to reach.</p><p><b>Gufwan / NCPWD's role:</b> Gufwan led the appeal for a facility. Governor Alex Otti approved a facility for the proposed office.</p><p><b>Partner credit:</b> Abia State Government and Governor Alex Otti.</p><p><b>Evidence and activity status:</b> The report documents advocacy and facility approval. It does not establish that the office opened or confirm current services. The photograph depicts the partner engagement, not Gufwan.</p><a href="https://fmino.gov.ng/gufwan-takes-governor-otti-as-champion-of-the-disabilities-community-in-nigeria/">Read source</a></article><article id="static-enforcement"><h3>6. Accessibility and enforcement</h3><p>Reported training · Hawthorn Suites, Garki, Abuja · Report: 2025-06-14</p><figure><a href="/photos/enforcement.webp"><img src="/photos/enforcement.webp" alt="Security personnel and other participants, including wheelchair users, posing together in front of a training banner." width="696" height="463" loading="lazy"></a><figcaption>Participants at the accessibility and anti-discrimination enforcement training. Individual identities are not assigned in this group frame.<p>Hawthorn Suites, Garki, Abuja · Report: 2025-06-14 · <a href="https://fmino.gov.ng/national-commission-for-persons-with-disabilities-organises-capacity-building-training-for-security-agencies-on-accessibility-and-anti-discrimination-enforcement/">Photograph published by FMINO</a></p></figcaption></figure><p>NCPWD and Nightstone Global organised capacity-building training for security personnel and taskforce officers on accessibility and anti-discrimination enforcement.</p><p><b>Gufwan / NCPWD's role:</b> The report attributes a keynote address to Gufwan and also names Director of Compliance and Enforcement Ikem Ochigbelam as his representative.</p><p><b>Partner credit:</b> Nightstone Global Ltd, NSCDC personnel and participating stakeholders.</p><p><b>Evidence and activity status:</b> Training and certificate presentation are reported. Personal attendance is not inferred from the keynote attribution or group photograph. Subsequent enforcement activity and barriers resolved remain unverified.</p><a href="https://fmino.gov.ng/national-commission-for-persons-with-disabilities-organises-capacity-building-training-for-security-agencies-on-accessibility-and-anti-discrimination-enforcement/">Read source</a></article><article id="static-health"><h3>7. Health and community outreach</h3><p>Reported delivery · Karonmajiji, Abuja · Report: 2025-12-19</p><figure><a href="/photos/health.webp"><img src="/photos/health.webp" alt="Community members waiting by tables where medical staff provide outreach support." width="696" height="927" loading="lazy"></a><figcaption>Community members and the medical team at the 18 December 2025 outreach. Lawrence Idemudia represented Gufwan.<p>Karonmajiji, Abuja · Report: 2025-12-19 · <a href="https://fmino.gov.ng/ncpwd-embarks-on-medical-outreach-treats-over-150-with-various-medical-conditions/">Photograph published by FMINO</a></p></figcaption></figure><p>The Commission reported a medical outreach in Karonmajiji on 18 December 2025, bringing medical support closer to community members.</p><p><b>Gufwan / NCPWD's role:</b> Lawrence Edelifo Idemudia, Director of Social Integration, represented Gufwan. The Commission’s Social Integration department supervised the activity.</p><p><b>Partner credit:</b> TLM, CHAI, CBM and Sightsavers, identified as development partners in the report.</p><p><b>Evidence and activity status:</b> Published 19 December, describing the previous day’s outreach. Wider medical provision was proposed after this pilot. No independently verified treatment total or longer-term health improvement is asserted here.</p><a href="https://fmino.gov.ng/ncpwd-embarks-on-medical-outreach-treats-over-150-with-various-medical-conditions/">Read source</a></article><article id="static-institutions"><h3>8. Stronger institutions</h3><p>Delivered engagement · Abuja / national coordination · Report: 2025-12-10</p><figure><a href="/photos/noa.webp"><img src="/photos/noa.webp" alt="Ayuba Gufwan and Lanre Issa-Onilu seated together, shaking hands at the NOA engagement." width="950" height="633" loading="lazy"></a><figcaption>Chief Ayuba Gufwan and NOA Director-General Lanre Issa-Onilu at an inclusion engagement.<p>NOA headquarters, Abuja · Report: 2025-12-10 · <a href="https://fmino.gov.ng/ncpwd-strengthens-collaboration-with-national-orientation-agency-to-deepen-national-disability-inclusion/">Photograph published by FMINO</a></p></figcaption></figure><figure><a href="/photos/leadership.webp"><img src="/photos/leadership.webp" alt="Chief Ayuba Gufwan seated at a table, speaking into a microphone." width="696" height="464" loading="lazy"></a><figcaption>Chief Ayuba Gufwan, in the photograph published with FMINO’s leadership profile.<p>Nigeria; photograph venue not specified · Report: 2024-10-26 · <a href="https://fmino.gov.ng/championing-inclusion-chief-ayuba-gufwans-mission-for-persons-with-disabilities-in-nigeria/">Photograph published by FMINO</a></p></figcaption></figure><figure><a href="/photos/cbm.webp"><img src="/photos/cbm.webp" alt="Gufwan, on the right, and CBM’s Abdulaziz Musa holding a publication together at a meeting table." width="696" height="464" loading="lazy"></a><figcaption>Gufwan and CBM Country Director Abdulaziz Musa at the partnership engagement.<p>CBM office, Abuja · Report: 2024-10-31 · <a href="https://fmino.gov.ng/gufwan-visits-christian-blind-mission-to-strengthen-ties-for-inclusivity/">Photograph published by FMINO</a></p></figcaption></figure><p>Gufwan led an engagement with NOA on disability awareness and inclusion. A joint technical committee was announced to coordinate next steps.</p><p><b>Gufwan / NCPWD's role:</b> Gufwan also visited CBM on 31 October 2024 to discuss accurate disability data and stronger cooperation. NCPWD sought NOA’s outreach capacity. Separately, the May 2026 NDMIS stakeholder workshop documented work toward harmonised disability data.</p><p><b>Partner credit:</b> Christian Blind Mission; National Orientation Agency; NDMIS stakeholder coordination reported by OSSAP-SNEO.</p><p><b>Evidence and activity status:</b> The CBM visit and NOA meeting took place; further CBM cooperation and committee delivery and nationwide coverage remain unverified. The NDMIS workshop is design work, not evidence of a deployed database or a live connection to this demonstration.</p><a href="https://fmino.gov.ng/ncpwd-strengthens-collaboration-with-national-orientation-agency-to-deepen-national-disability-inclusion/">Read source</a><p><a href="https://fmino.gov.ng/gufwan-visits-christian-blind-mission-to-strengthen-ties-for-inclusivity/">CBM report</a> · <a href="https://ossaposneo.org/brief-report-of-the-3-day-stakeholders-consultative-workshop-on-the-development-of-the-national-disability-management-information-system-ndmis/">NDMIS report</a></p></article>
<h2>Milestones during his tenure.</h2><details><summary>2024-08-06 &middot; Appointment announced</summary><p>Appointment</p><p>The Presidency names Ayuba Gufwan as Executive Secretary of NCPWD.</p><a href="https://statehouse.gov.ng/president-tinubu-appoints-new-heads-of-agencies-and-programmes-under-the-federal-ministry-of-humanitarian-affairs-disaster-management-and-social-management/">Read source</a><p>Evidence caveat: Ayuba Gufwan’s appointment was announced on 6 August 2024.</p></details><details><summary>2024-09-21 &middot; Civic participation</summary><p>Delivered engagement</p><p>The Commission’s situation room monitored participation in the Edo governorship and Kwara local elections. Gufwan spoke to journalists about voting rights.</p><figure><a href="/photos/civic.webp"><img src="/photos/civic.webp" alt="Chief Ayuba Gufwan holding a microphone and gesturing with an open hand." width="696" height="464" loading="lazy"></a><figcaption>Gufwan speaking during election monitoring at the Commission’s situation room.<p>NCPWD headquarters, Abuja · Report: 2024-09-21 · <a href="https://fmino.gov.ng/persons-with-disabilities-franchise-can-never-be-undermined-gufwan/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/persons-with-disabilities-franchise-can-never-be-undermined-gufwan/">Read source</a><p>Evidence caveat: A polling-unit access barrier in Edo required assistance. Violence in one Kwara ward was also reported. Monitoring and reported assistance do not establish universal access or nationwide voting outcomes.</p></details><details><summary>2024-09-26 &middot; Inclusive education</summary><p>Advocacy and discussion</p><p>At UBEC, Gufwan called for learning materials, assistive devices and better access to education for children with disabilities, including girls.</p><figure><a href="/photos/education-2.webp"><img src="/photos/education-2.webp" alt="Gufwan, seated on the right, speaking across a meeting table with a UBEC official." width="950" height="633" loading="lazy"></a><figcaption>Gufwan during the UBEC partnership discussion on inclusive education.<p>UBEC, Abuja · Report: 2024-09-26 · <a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Read source</a><p>Evidence caveat: The report documents advocacy and partnership discussion. It does not establish that NCPWD provided the proposed materials, opened schools or achieved educational outcomes.</p></details><details><summary>2024-10-31 &middot; CBM partnership engagement</summary><p>Delivered engagement</p><p>Gufwan discusses accurate data and stronger cooperation with CBM. Subsequent delivery is unverified.</p><figure><a href="/photos/cbm.webp"><img src="/photos/cbm.webp" alt="Gufwan, on the right, and CBM’s Abdulaziz Musa holding a publication together at a meeting table." width="696" height="464" loading="lazy"></a><figcaption>Gufwan and CBM Country Director Abdulaziz Musa at the partnership engagement.<p>CBM office, Abuja · Report: 2024-10-31 · <a href="https://fmino.gov.ng/gufwan-visits-christian-blind-mission-to-strengthen-ties-for-inclusivity/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/gufwan-visits-christian-blind-mission-to-strengthen-ties-for-inclusivity/">Read source</a><p>Evidence caveat: Gufwan’s Abuja visit discussed accurate data, coordination and deeper cooperation; subsequent delivery is unverified.</p></details><details><summary>2025-01-19 &middot; Services closer to communities</summary><p>Announced plan</p><p>During a working visit to Abia, Gufwan advocated for a Southeast zonal office to make the Commission easier to reach.</p><figure><a href="/photos/abia.webp"><img src="/photos/abia.webp" alt="Governor Alex Otti holding a microphone beside a seated woman at the Abia partner engagement." width="950" height="634" loading="lazy"></a><figcaption>Governor Alex Otti at the partner engagement covered in the regional-access report. Gufwan is not pictured in this frame.<p>Abia State · Report: 2025-01-19 · <a href="https://fmino.gov.ng/gufwan-takes-governor-otti-as-champion-of-the-disabilities-community-in-nigeria/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/gufwan-takes-governor-otti-as-champion-of-the-disabilities-community-in-nigeria/">Read source</a><p>Evidence caveat: The report documents advocacy and facility approval. It does not establish that the office opened or confirm current services. The photograph depicts the partner engagement, not Gufwan.</p></details><details><summary>2025-06-14 &middot; Accessibility and enforcement</summary><p>Reported training</p><p>NCPWD and Nightstone Global organised capacity-building training for security personnel and taskforce officers on accessibility and anti-discrimination enforcement.</p><figure><a href="/photos/enforcement.webp"><img src="/photos/enforcement.webp" alt="Security personnel and other participants, including wheelchair users, posing together in front of a training banner." width="696" height="463" loading="lazy"></a><figcaption>Participants at the accessibility and anti-discrimination enforcement training. Individual identities are not assigned in this group frame.<p>Hawthorn Suites, Garki, Abuja · Report: 2025-06-14 · <a href="https://fmino.gov.ng/national-commission-for-persons-with-disabilities-organises-capacity-building-training-for-security-agencies-on-accessibility-and-anti-discrimination-enforcement/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/national-commission-for-persons-with-disabilities-organises-capacity-building-training-for-security-agencies-on-accessibility-and-anti-discrimination-enforcement/">Read source</a><p>Evidence caveat: Training and certificate presentation are reported. Personal attendance is not inferred from the keynote attribution or group photograph. Subsequent enforcement activity and barriers resolved remain unverified.</p></details><details><summary>2025-07-07 &middot; Skills and livelihoods</summary><p>Reported delivery</p><p>The Commission reported distributing fertilizers and basic farming tools to participants organised through disability associations.</p><figure><a href="/photos/farm.webp"><img src="/photos/farm.webp" alt="Participants, including wheelchair users, beside fertilizer sacks and boxes at the agricultural-support activity." width="950" height="633" loading="lazy"></a><figcaption>Participants at the Commission’s agricultural-support distribution.<p>Nigeria; venue not specified in report · Report: 2025-07-07 · <a href="https://fmino.gov.ng/empowering-persons-with-disabilities-in-agriculture-ncpwd-distributes-fertilizers-and-farming-tools/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/empowering-persons-with-disabilities-in-agriculture-ncpwd-distributes-fertilizers-and-farming-tools/">Read source</a><p>Evidence caveat: Published 7 July 2025; the body states 7 June and an inconsistent weekday, so the activity date remains uncertain. No yield or income improvement is established. The separate November skills partnership is proposed collaboration, not completed training.</p></details><details><summary>2025-10-11 &middot; Mobility and participation</summary><p>Reported delivery</p><p>A joint mobility-support activity brought tricycles and assistive devices to persons with disabilities in Otukpo.</p><figure><a href="/photos/mobility-2.webp"><img src="/photos/mobility-2.webp" alt="Rows of colourful three-wheeled mobility devices arranged at the Otukpo activity." width="1024" height="683" loading="lazy"></a><figcaption>Tricycles pictured in the mobility-support report, delivered through a partnership with Beautiful Gate and Senator Abba Moro.<p>Otukpo, Benue State · Report: 2025-10-11 · <a href="https://qualitativemagazine.com/ncpwd-beautiful-gate-foundation-senator-abba-moro-empower-pwds-in-benue-with-thousands-of-tricycles-and-assistive-devices/">Photograph published by The Qualitative Magazine</a></p></figcaption></figure><a href="https://qualitativemagazine.com/ncpwd-beautiful-gate-foundation-senator-abba-moro-empower-pwds-in-benue-with-thousands-of-tricycles-and-assistive-devices/">Read source</a><p>Evidence caveat: The media report describes distribution. Recipient totals, sustained device use and economic outcomes have not been independently verified here.</p></details><details><summary>2025-11-07 &middot; Skills partnership proposed</summary><p>Announced plan</p><p>NCPWD and Amnesty International discuss skills acquisition and inclusion collaboration.</p><a href="https://fmino.gov.ng/ncpwd-amnesty-international-to-collaborate-on-skills-acquisition-inclusion-programs-for-persons-with-disabilities/">Read source</a><p>Evidence caveat: Proposed skills acquisition and inclusion collaboration establishes alignment, not measured outcomes.</p></details><details><summary>2025-12-10 &middot; NOA inclusion engagement</summary><p>Delivered engagement</p><p>A courtesy visit connects the inclusion agenda with NOA’s outreach capacity.</p><figure><a href="/photos/noa.webp"><img src="/photos/noa.webp" alt="Ayuba Gufwan and Lanre Issa-Onilu seated together, shaking hands at the NOA engagement." width="950" height="633" loading="lazy"></a><figcaption>Chief Ayuba Gufwan and NOA Director-General Lanre Issa-Onilu at an inclusion engagement.<p>NOA headquarters, Abuja · Report: 2025-12-10 · <a href="https://fmino.gov.ng/ncpwd-strengthens-collaboration-with-national-orientation-agency-to-deepen-national-disability-inclusion/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/ncpwd-strengthens-collaboration-with-national-orientation-agency-to-deepen-national-disability-inclusion/">Read source</a><p>Evidence caveat: The CBM visit and NOA meeting took place; further CBM cooperation and committee delivery and nationwide coverage remain unverified. The NDMIS workshop is design work, not evidence of a deployed database or a live connection to this demonstration.</p></details><details><summary>2025-12-19 &middot; Health and community outreach</summary><p>Reported delivery</p><p>The Commission reported a medical outreach in Karonmajiji on 18 December 2025, bringing medical support closer to community members.</p><figure><a href="/photos/health.webp"><img src="/photos/health.webp" alt="Community members waiting by tables where medical staff provide outreach support." width="696" height="927" loading="lazy"></a><figcaption>Community members and the medical team at the 18 December 2025 outreach. Lawrence Idemudia represented Gufwan.<p>Karonmajiji, Abuja · Report: 2025-12-19 · <a href="https://fmino.gov.ng/ncpwd-embarks-on-medical-outreach-treats-over-150-with-various-medical-conditions/">Photograph published by FMINO</a></p></figcaption></figure><a href="https://fmino.gov.ng/ncpwd-embarks-on-medical-outreach-treats-over-150-with-various-medical-conditions/">Read source</a><p>Evidence caveat: Published 19 December, describing the previous day’s outreach. Wider medical provision was proposed after this pilot. No independently verified treatment total or longer-term health improvement is asserted here.</p></details><details><summary>2026-05-22 &middot; NDMIS workshop reported</summary><p>Reported output</p><p>A report describes the 18–20 May stakeholder workshop; deployment remains unverified.</p><a href="https://ossaposneo.org/brief-report-of-the-3-day-stakeholders-consultative-workshop-on-the-development-of-the-national-disability-management-information-system-ndmis/">Read source</a><p>Evidence caveat: The May 18–20 workshop outlined harmonised disability data and proposed integration. Its July target does not verify deployment.</p></details>

www.beautifulgatewheelchairs.org/">Beautiful Gate: the organisation?s story</a></h3><p>Not dated · Beautiful Gate describes the mobility workshop in Jos and its origins with Ayuba Gufwan and Ron Rice. This is the organisation?s own account.</p></article><article><h3><a href="https://www.thecable.ng/interview-why-we-proposed-allocating-10-of-government-interventions-to-pwds-by-ayuba-gufwan/">TheCable: Gufwan on inclusion and public priorities</a></h3><p>2025-11-15 · A first-person interview on education, accessibility, disability data and the Commission?s priorities. Statements and proposed initiatives remain attributed to the interview.</p></article></section><section id="static-explore"><div class="site-page-heading"><div><h2>Learning Sandbox.</h2><p>Build practical skills with guidance and support.</p></div><a href="#static-app-demo">Explore the sample workspace</a></div><link rel="preload" as="image" href="/photos/remote-admin-1-office-v4.webp"/><link rel="preload" as="image" href="/photos/remote-admin-2-office-v4.webp"/><link rel="preload" as="image" href="/photos/remote-digital-facilitator-v4.webp"/><link rel="preload" as="image" href="/photos/remote-sewing-facilitator-v4.webp"/><link rel="preload" as="image" href="/photos/remote-electronics-facilitator-v4.webp"/><link rel="preload" as="image" href="/photos/remote-business-facilitator-v4.webp"/><link rel="preload" as="image" href="/photos/remote-digital-home-1-v4.webp"/><link rel="preload" as="image" href="/photos/remote-digital-home-2-v4.webp"/><link rel="preload" as="image" href="/photos/remote-sewing-home-1-v4.webp"/><link rel="preload" as="image" href="/photos/remote-sewing-home-2-v4.webp"/><link rel="preload" as="image" href="/photos/remote-electronics-home-1-v4.webp"/><link rel="preload" as="image" href="/photos/remote-electronics-home-2-v4.webp"/><link rel="preload" as="image" href="/photos/remote-business-home-1-v4.webp"/><link rel="preload" as="image" href="/photos/remote-business-home-2-v4.webp"/><fig <section id="static-research"><div class="showcase research-page"><section class="section public-page sampling-framework" aria-labelledby="sampling-heading"><div class="site-page-heading"><div><h2>Research &amp; Data Collection.</h2><p>A proposed Plateau pilot: reliable disability data connected to accessible online teaching.</p></div></div><section class="research-presentation" aria-labelledby="presentation-heading"><h2 id="presentation-heading">Impact Mosaic — Connecting people, evidence and accessible learning</h2><p>Five opening slides · A proposed Plateau pilot</p><p><a href="/?page=research">Return to the presentation</a> · <a href="/research/reading.html">Read or print all five slides</a></p><details class="research-linear" open=""><summary>Read the five slides as a continuous page</summary><article id="reading-research-slide-1"><h3>1. IMPACT MOSAIC</h3><ul><li>Connecting people, evidence and accessible learning</li><li>A proposed Plateau pilot</li><li>Building toward wider reach across Nigeria</li><li>Strong · Jerry Bannister Zachary</li><li>Project Co-Creators</li></ul><p>Approved unity artwork: six African people with Nigeria’s flag, including a person with albinism, a wheelchair user, white cane, walking stick, crutch and hijab. AI-generated artwork; no actual participants depicted.</p><figure><a href="/impact-mosaic-unity-haircuts.png"><img src="/impact-mosaic-unity-haircuts.png" alt="Six African people united with Nigeria’s green-white-green flag, including a wheelchair user and people with a white cane, walking stick, albinism and hijab; the standing person in green leans on a crutch while embracing the team." width="900" height="600" loading="lazy"/></a><figcaption>Approved Impact Mosaic unity artwork. Illustration, not a participant photograph. AI-generated artwork for Impact Mosaic</figcaption></figure></article><article id="reading-research-slide-2"><h3>2. Table of Contents</h3><nav aria-label="Presentation contents"><details><summary>01 Our Shared Vision</summary><ul><li><a href="#reading-research-slide-3">Talent is everywhere. Access to learning should be too. — 3</a></li><li><a href="#reading-research-slide-4">Building on your work: one database, an adaptive cycle — 4</a></li><li><a href="#reading-research-slide-5">Participation needs more than registration. — 5</a></li></ul></details><details><summary>02 Building on Community Experience · Planned</summary><ul><li><span>A community foundation already in motion — 6 · Planned</span></li><li><span>Practical experience and statistics, together — 7 · Planned</span></li></ul></details><details><summary>03 Strengthening Recruitment with Statistics · Planned</summary><ul><li><span>Start with varied community contacts — 8 · Planned</span></li><li><span>Let each recruitment round guide the next — 9 · Planned</span></li><li><span>Give people several ways to join — 10 · Planned</span></li><li><span>From community outreach to a measurable recruitment process — 11 · Planned</span></li><li><span>A model that learns and guides the next round — 12 · Planned</span></li><li><span>Test whether the additions help — 13 · Planned</span></li><li><span>Make participation simple and respectful — 14 · Planned</span></li></ul></details><details><summary>04 Connecting People to Accessible Learning · Planned</summary><ul><li><span>Turn registration into a learning pathway — 15 · Planned</span></li><li><span>Match people with suitable teaching — 16 · Planned</span></li><li><span>One learning goal, accessible ways to practise — 17 · Planned</span></li><li><span>See the working prototype — 18 · Planned</span></li></ul></details><details><summary>05 Designing a Plateau Pilot · Planned</summary><ul><li><span>Agree a focused Plateau pilot — 19 · Planned</span></li><li><span>Decide what success means — 20 · Planned</span></li><li><span>Move forward when each stage is ready — 21 · Planned</span></li><li><span>Turn experience into shared evidence — 22 · Planned</span></li></ul></details><details><summary>06 Building the Partnership · Planned</summary><ul><li><span>Build the team around the work — 23 · Planned</span></li><li><span>Three agreements to begin — 24 · Planned</span></li></ul></details></nav><p>Expand a section to see its subsections. Slides 3–5 are available; slides 6–24 are planned.</p></article><article id="reading-research-slide-3"><h3>3. Talent is everywhere.
Access to learning should be too.</h3><ul><li>Through Beautiful Gate, your work has helped remove mobility barriers for people like James Ahumbe.</li><li>We propose to build on that foundation through adaptive sampling and a participant register capturing people’s skills, interests and learning needs.</li><li>This would help us connect participants with suitable teaching, monitor their learning progress and adjust support as their needs change.</li></ul><p>Historical Beautiful Gate beneficiary, identified by name and photograph on page 3 of Wheelchairs for Nigeria’s July 2023 newsletter. The source identifies James Ahumbe as a cobbler who received a replacement tricycle. The photograph shows him with that tricycle; it does not show shoemaking or establish that Beautiful Gate taught him his trade. The proposed learning pathway and sandbox are separate prospective work; no partnership, endorsement or learning outcome is implied.</p><p><a href="https://www.wheelchairsfornigeria.org/newsletters">Wheelchairs for Nigeria · newsletter archive</a></p><figure><a href="/photos/james-ahumbe-beautiful-gate.jpg"><img src="/photos/james-ahumbe-beautiful-gate.jpg" alt="James Ahumbe smiling while seated on a tricycle wheelchair, wearing a navy shirt and resting one hand on its red hand pedal." width="900" height="600" loading="lazy"/></a><figcaption>James Ahumbe with a tricycle wheelchair. Wheelchairs for Nigeria’s July 2023 newsletter, page 3, identifies him as a cobbler who received a replacement tricycle through Beautiful Gate. The photograph shows mobility support, not shoemaking or skills training. <a href="https://www.wheelchairsfornigeria.org/_files/ugd/8d854e_ffd0fdd619874f11a285bcacaa816a64.pdf#page=3">Photograph published by Wheelchairs for Nigeria; photographer not named</a></figcaption></figure></article><article id="reading-research-slide-4"><h3>4. Building on your work: one database, an adaptive cycle</h3><ul><li>Your community relationships, outreach and practical support</li><li>Proposed extension: Designed together</li><li>Adaptive sampling: Use recorded recruitment evidence to adjust the next outreach round, investigate gaps and decide where to focus effort.</li><li>Understand needs: Review recorded skills, interests and access needs with participants to understand the learning and support that would suit them.</li><li>Match teaching: Use recorded interests and learning needs to identify suitable teaching. The learner and facilitator agree the arrangement.</li><li>Support practice: Use the agreed learning plan and support needs to guide accessible teaching, practical tasks and feedback.</li><li>Monitor &amp; review: Record learning progress and recruitment evidence in the database. Use progress to adjust support and recruitment evidence to refine outreach.</li><li>Participant database: Keep recruitment details, skills, learning needs, agreed support and progress together. These records inform decisions throughout the cycle.</li><li>Adaptive sampling: Recruitment feeds the database; its records guide the next round.</li><li>Adaptive sampling: Adaptive recruitment feeds the participant database. Recorded recruitment evidence guides each new sampling round.</li><li>Understand needs: Skills, interests and learning needs</li><li>Match teaching: Agree suitable teaching with the learner and facilitator</li><li>Support practice: Accessible teaching and practical feedback</li><li>Monitor &amp; review: Monitor recruitment evidence and learning progress, update the participant database, then use the updated records to refine recruitment, teaching and support. The cycle repeats.</li><li>Participant database: Recruitment routes; Skills and interests; Learning needs; Agreed teaching and support; Learning progress</li><li>Recruitment evidence → outreach: Recruitment evidence informs each new outreach round; the cycle repeats.</li><li>Learning progress → support: Learning progress informs teaching and support adjustments.</li><li>Proposed Plateau pilot · Records inform decisions throughout the cycle</li></ul><p>Conceptual proposed Plateau pilot pathway, not an observation of an existing end-to-end service or an agreed partnership. Build on Gufwan’s community relationships and practical support; confirm the existing process with his team. Adaptive sampling, the participant database, teaching arrangements and monitoring require joint design. Recruitment evidence informs outreach; learning progress informs teaching/support. Registration and optional research remain separate. Foundation photographs document a Beautiful Gate/Senator Abba Moro mobility partnership and Gufwan’s historical UBEC education discussion. Partner credits remain explicit; photographs are not pilot activity or evidence of delivered learning. Illustrated stages are conceptual. The closed loop represents continuing programme improvement, not a requirement for individual participants to remain indefinitely. Recruitment populates the database. Its records inform all subsequent needs, teaching and support decisions; monitoring updates those records and informs later adaptive recruitment. Decisions remain participant/facilitator-led, not automatic database actions. No model fit, participant records, recruitment outcome or pilot activity is depicted.</p><figure><a href="/photos/mobility-foundation-original.jpg"><img src="/photos/mobility-foundation-original.jpg" alt="Rows of colourful three-wheeled mobility devices arranged at the Otukpo activity." width="900" height="600" loading="lazy"/></a><figcaption>Tricycles pictured in the mobility-support report, delivered through a partnership with Beautiful Gate and Senator Abba Moro. Report: 2025-10-11. Otukpo, Benue State. <a href="https://qualitativemagazine.com/ncpwd-beautiful-gate-foundation-senator-abba-moro-empower-pwds-in-benue-with-thousands-of-tricycles-and-assistive-devices/">Photograph published by The Qualitative Magazine</a></figcaption></figure><figure><a href="/photos/education-foundation-original.jpg"><img src="/photos/education-foundation-original.jpg" alt="Gufwan, seated on the right, speaking across a meeting table with a UBEC official." width="900" height="600" loading="lazy"/></a><figcaption>Gufwan during the UBEC partnership discussion on inclusive education. Report: 2024-09-26. UBEC, Abuja. <a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Photograph published by FMINO</a></figcaption></figure></article><article id="reading-research-slide-5"><h3>5. Participation needs more than registration.</h3><ul><li>Suitable teaching and facilitator capacity</li><li>Accessible communication and learning formats</li><li>Devices and connectivity, where needed</li><li>Support agreed with participants</li></ul><p>Historical UBEC inclusive-education discussion, not an activity of the proposed pilot. These are practical requirements to assess and agree with participants, not measured deficiencies in Gufwan’s existing work. Registration and optional research remain separate; resources and operational arrangements are to be agreed.</p><figure><a href="/photos/education-2.webp"><img src="/photos/education-2.webp" alt="Gufwan, seated on the right, speaking across a meeting table with a UBEC official." width="900" height="600" loading="lazy"/></a><figcaption>Gufwan during the UBEC partnership discussion on inclusive education. Report: 2024-09-26. UBEC, Abuja. <a href="https://fmino.gov.ng/children-with-disabilities-deserve-more-attention-to-attain-their-aspirations-in-life-ayuba-gufwan/">Photograph published by FMINO</a></figcaption></figure></article></details></section><section aria-labelledby="sampling-heading"><h2 id="sampling-heading">Building on Gufwan’s foundation.</h2><p class="sampling-intro">WHO’s historical profile connects Gufwan’s experience of polio with his work helping others access mobility and education. <a href="https://www.afro.who.int/news/neglect-inspiration-ayuba-gufwans-story">WHO: From neglect to inspiration</a>.</p><p class="sampling-intro">Beautiful Gate reports more than 24,000 wheelchairs across 28 states, alongside other mobility and education support. These are its own cumulative figures without a reporting date. <a href="https://www.beautifulgatewheelchairs.org/">Beautiful Gate’s own account</a>. A 2017 account describes production in Jos and outreach across 23 states at that time. <a href="https://www.crcna.org/news-and-events/news/entering-through-beautiful-gate">World Renew: Entering through the Beautiful Gate</a>. Historical reach is not a complete current register.</p><p class="sampling-intro">In his 2025 interview, Gufwan discusses disability data, education and access to services. These are attributed priorities and reported initiatives. <a href="https://www.thecable.ng/interview-why-we-proposed-allocating-10-of-government-interventions-to-pwds-by-ayuba-gufwan/">TheCable: Interview with Ayuba Gufwan</a>.</p><p class="sampling-intro">November 2026 reporting describes a workshop validating revised KPIs and NDMIS data collection tools, and a call for reliable disability data. <a href="https://inclusivenews.com.ng/credible-disability-data-key-to-effective-planning-service-delivery-gufwan/">Inclusive News Network: Disability data and NDMIS workshop</a>. Possible alignment is a technical discussion; this report does not establish deployment, endorsement or an existing integration with our prototype.</p></section><section><h2>Our contribution as two statisticians.</h2><p class="sampling-intro">Jerry Bannister Zachary and Strong propose to contribute recruitment design, data quality checks, coverage monitoring and evaluation. We are two statisticians with a working prototype.</p><p class="sampling-intro">We propose to design varied recruitment channels, check duplicates and missing information, monitor who is being missed, and evaluate the pathway from registration to teaching and demonstrated skills.</p><p class="sampling-intro">Two statisticians helping build a reliable database of people with disabilities and connect participants to accessible online teaching, building on Gufwan’s foundation.</p><p class="research-status">This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p></section><section class="pilot-scope"><h2>A proposed Plateau pilot.</h2><p class="sampling-intro">Plateau is our proposed starting location for a limited pilot. Exact communities, eligibility, participant numbers and courses will be agreed during technical scoping.</p><p class="sampling-intro">Proposed activities: accessible voluntary registration, weekly coverage reviews, facilitator readiness checks, learner matching and supported teaching, followed by cohort review.</p><p class="sampling-intro">An approximately 20-week sequence is illustrative. The clock starts only after agreed readiness conditions: responsibilities, community permissions, consent and data arrangements, staffing, funding, secure collection and access support. Stages overlap and may take longer. Completion reviews depend on a full course cycle; registration and national expansion remain open-ended.</p><h3>Three decisions for a first meeting</h3><ol><li>Nominate a technical counterpart for a scoping discussion.</li><li>Identify potential community introductions in Plateau, subject to their agreement.</li><li>Agree pilot-scoping requirements: communities, eligibility, courses, capacity, data governance, costs and readiness.</li></ol><p><a href="/downloads/plateau-pilot-discussion-brief.html">Open the Plateau Pilot Discussion Brief →</a> · Print or save as PDF in your browser.</p></section><h2>Database recruitment and separate research sampling.</h2><div class="sampling-participants"><section aria-labelledby="sampling-learners"><h3 id="sampling-learners">People with disabilities</h3><p>Register voluntarily, describe learning interests and access needs, and choose whether to take up online learning. Registration would not require agreeing to research.</p></section><section aria-labelledby="sampling-facilitators"><h3 id="sampling-facilitators">Online facilitators</h3><p>Recruit people with relevant subject skills, review their teaching and accessibility readiness, and match their availability to learners’ needs.</p></section></div><h2>How sampling fits.</h2><p class="sampling-intro">Database enrolment would remain open to eligible people reached through several channels. Our proposed approach is adaptive snowball recruitment: begin with varied community contacts, invite voluntary referrals, review coverage weekly and change outreach where people are being missed. This builds on <a href="https://unhcr.github.io/Integrated-framework-household-survey/Sampling.html">documented snowball sampling</a>; the adaptive coverage reviews are our proposed addition. It is not formal adaptive cluster sampling and does not create a representative national sample. Representative research remains conditional on a defined target population, a suitable sampling frame and a justified design. Register-based findings describe the covered population; we do not promise national estimates from the register.</p><p class="research-status">In planning. Research recruitment and data collection are not open.</p><section class="sampling-statistics" aria-labelledby="sampling-statistics-heading"><h2 id="sampling-statistics-heading">The sampling plan, explained side by side.</h2><p id="sampling-timing-note">An approximately 20-week sequence is illustrative. The clock starts only after agreed readiness conditions: responsibilities, community permissions, consent and data arrangements, staffing, funding, secure collection and access support. Stages overlap and may take longer. Completion reviews depend on a full course cycle; registration and national expansion remain open-ended.</p><p class="sampling-source-note">The small animations illustrate processes, not participant counts or results. They stop after a few seconds.</p><div class="sampling-table-scroll" role="region" aria-label="Sampling methods and pilot time frames" tabindex="0"><table class="sampling-methods" aria-describedby="sampling-timing-note"><caption>From community outreach to a growing database and online learning</caption><thead><tr><th scope="col">Stage</th><th scope="col">Statistical method</th><th scope="col">In everyday language</th><th scope="col">Practical time frame</th></tr></thead><tbody><tr><th scope="row"><svg class="sampling-mini sampling-mini-groups" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><rect x="9" y="5" width="22" height="50" rx="6" fill="none" stroke="currentColor" opacity=".5"></rect><rect x="53" y="5" width="22" height="50" rx="6" fill="none" stroke="currentColor" opacity=".5"></rect><rect x="97" y="5" width="22" height="50" rx="6" fill="none" stroke="currentColor" opacity=".5"></rect><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g></svg><span>Define coverage</span></th><td><strong>Stratification and frame assessment</strong><p>Group by geography and relevant participant characteristics; document who the available lists exclude.</p></td><td>Plan who we need to reach, so one well-connected community does not stand in for the whole country.</td><td><strong>Weeks 1–3</strong><p>Agree pilot area, eligibility, partners and data arrangements.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-network" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><path d="M20 30L64 14 108 30 64 46Z" fill="none" stroke="currentColor" stroke-width="1.5"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g></svg><span>Build the register</span></th><td><strong>Adaptive snowball recruitment with purposive starting contacts</strong><p>Monitor referral channels and coverage weekly. Add starting contacts or offline outreach when groups are missing or referrals repeat the same networks. This remains non-probability recruitment; selection chances are unknown.</p></td><td>Ask willing people to pass on an invitation. Check who is being missed, then find new community contacts to reach them. People can register without joining the research.</td><td><strong>Weeks 4–8; then ongoing</strong><p>Begin after consent materials and secure registration are ready; agree adaptation rules during the pilot.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-check" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M13 48l5 4 10-11" fill="none" stroke="currentColor" stroke-width="2"></path></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M57 48l5 4 10-11" fill="none" stroke="currentColor" stroke-width="2"></path></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M101 48l5 4 10-11" fill="none" stroke="currentColor" stroke-width="2"></path></g></svg><span>Test the process</span></th><td><strong>Accessible questionnaire pilot and response diagnostics</strong><p>Measure interview duration, item non-response and contact-to-completion rates by collection mode.</p></td><td>Try the questions and registration with different people. Fix confusing wording and barriers before expanding.</td><td><strong>Weeks 4–6</strong><p>Retest translations, accommodations and changed questions as needed.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-size" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><path d="M8 8V4H124V8M8 52V56H124V52" fill="none" stroke="currentColor" stroke-width="2"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g></svg><span>Plan the study size</span></th><td><strong>Precision, design effect and non-response allowance</strong><p>For a proportion: n₀ = z²p(1−p)/e²; invitations ≈ n₀ × DEFF / r, rounded up. This is a starting approximation, not a project target.</p></td><td>Decide how precise answers need to be, allow for grouped sampling and invite extra people because some will not respond.</td><td><strong>Weeks 7–9</strong><p>Use pilot evidence, budget and reporting needs; revise before drawing the sample.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-select" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.2"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.2"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.2"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.2"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.2"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.2"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g></svg><span>Select and survey</span></th><td><strong>Stratified probability sampling where a usable frame exists</strong><p>Randomly select within defined groups; retain stratum IDs, inclusion probabilities and response dispositions.</p></td><td>For research, draw names fairly from the agreed lists. Keep ordinary registration open and do not substitute convenient volunteers for sampled people.</td><td><strong>Weeks 10–15</strong><p>Requires a checked sampling frame, trained team and agreed study protocol.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-weights" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="3" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="3" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="3" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="5" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="5" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="5" fill="currentColor" opacity="0.8"></circle></g></svg><span>Check and estimate</span></th><td><strong>Quality checks, survey weights and confidence intervals</strong><p>Audit duplicates and missingness. Start with wᵢ = 1/πᵢ; justify response adjustments. Estimate uncertainty using strata and clusters.</p></td><td>Check the records, account for unequal selection chances and show how uncertain the research findings are.</td><td><strong>Daily during collection; weeks 16–18 for analysis</strong><p>Weights cannot recover people entirely absent from the frame.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-match" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M25 14l20 16-20 16" fill="none" stroke="currentColor" stroke-width="1.5"></path></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M69 14l20 16-20 16" fill="none" stroke="currentColor" stroke-width="1.5"></path></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle><path d="M113 14l20 16-20 16" fill="none" stroke="currentColor" stroke-width="1.5"></path></g></svg><span>Connect online teaching</span></th><td><strong>Demand–capacity cross-tabulation</strong><p>Compare learner interests, language, access needs and availability with reviewed facilitator capacity; monitor unmatched requests.</p></td><td>Find suitable teachers for learners and see where more teaching capacity or connectivity support is needed.</td><td><strong>Recruit facilitators in weeks 4–10; match from week 11</strong><p>Lessons start only when teachers, learners and access support are ready.</p></td></tr><tr><th scope="row"><svg class="sampling-mini sampling-mini-trend" viewBox="0 0 132 60" aria-hidden="true" focusable="false"><path d="M12 30H120" fill="none" stroke="currentColor" opacity=".25"></path><g class="sampling-mini-group" style="animation-delay:0s"><circle cx="20" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="20" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.25s"><circle cx="64" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="64" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><g class="sampling-mini-group" style="animation-delay:0.5s"><circle cx="108" cy="14" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="30" r="4" fill="currentColor" opacity="0.8"></circle><circle cx="108" cy="46" r="4" fill="currentColor" opacity="0.8"></circle></g><path d="M12 48L48 36 82 40 120 10" fill="none" stroke="currentColor" stroke-width="3"></path></svg><span>Learn and expand</span></th><td><strong>Cohort tracking, completion rates and attrition analysis</strong><p>Follow each starting cohort; report completion with its denominator, missing follow-ups and differences between groups.</p></td><td>See who starts, finishes or needs help. Use that evidence to improve the next intake and reach new areas.</td><td><strong>First review around weeks 19–20; monthly thereafter</strong><p>Allow a full course cycle before judging completion. National expansion remains open.</p></td></tr></tbody></table></div><p class="sampling-source-note">Formula key: z = confidence multiplier; p = anticipated proportion; e = desired absolute margin of error; DEFF = design effect; r = anticipated response fraction; πᵢ = a person’s inclusion probability. A known finite population may need a finite-population correction. Subgroup reporting can require a larger sample; there is no fixed national sample size yet.</p><p class="sampling-source-note">Methods draw on <a href="https://www.worldbank.org/en/programs/lsms/sampling">World Bank sampling guidance</a>, <a href="https://unhcr.github.io/Integrated-framework-household-survey/Sampling.html">UNHCR’s explanation of recruitment bias</a> and <a href="https://worldbank.github.io/dime-data-handbook/acquisition.html">the DIME data-collection handbook</a>. The time ranges and delivery sequence are our proposed plan.</p></section><details class="sampling-outline" open=""><summary>Proposed framework · from outreach to online learning</summary><ol><li><strong>Define who and where to reach.</strong> Agree eligibility, an initial pilot area and expansion across the six geopolitical zones. Monitor state, rural and urban coverage, gender and access needs. Nationwide reach is the goal; coverage must be demonstrated.</li><li><strong>Use adaptive snowball recruitment.</strong> Seek varied starting contacts through disability organisations, community groups and training centres, including Gufwan’s networks where agreed. Referrals should share invitations, not another person’s private details. Review coverage and referral yield weekly; add new contacts and assisted, in-person or accessible remote registration where gaps persist. Agree review triggers during the pilot and log each adaptation. Continue looking beyond referral networks for isolated people.</li><li><strong>Build and maintain the database.</strong> Explain use and consent; collect only necessary contact, location, learning and support information. Separate optional research consent, check duplicates, restrict access and provide correction and withdrawal routes. Pilot accessible questions with people with disabilities; use suitable <a href="https://www.washingtongroup-disability.com/implementation/implementation-guidelines/">Washington Group tools</a> for research on functioning, alongside separate questions about learning support.</li><li><strong>Recruit facilitators and connect learning.</strong> Review subject knowledge, online teaching and accessibility skills. Record availability, languages and capacity, then match learners by goals and support requirements. Identify device, connectivity and accommodation barriers before lessons begin.</li><li><strong>Select a separate research sample.</strong> Define the study question and the population a usable sampling list covers. Where feasible, randomly select within agreed groups. Calculate sample size from required precision, subgroup reporting, design effects, expected non-response and budget. Record selection probabilities and response outcomes for weighting. Registry-based results describe its covered population; national estimates need a suitable national sampling frame. <a href="https://www.worldbank.org/en/programs/lsms/sampling">World Bank sampling guidance</a> informs this design.</li><li><strong>Follow up and improve coverage.</strong> Track registrations, matches, attendance, completion and unresolved support needs. Check who drops out or remains unreached, and adapt outreach. Report missing data and research uncertainty. Referral counts, statistical weights or Bayesian models alone cannot establish national representativeness.</li></ol></details><section class="sampling-statistics"><h2>Proposed measures of success.</h2><p>Every measure below is proposed for agreement during scoping. No results, budget amounts or performance targets are available. These describe delivery and coverage, without establishing causal impact.</p><div class="sampling-table-scroll" role="region" aria-label="Proposed pilot measurements" tabindex="0"><table class="sampling-methods"><caption>Proposed definitions and collection frequency</caption><thead><tr><th scope="col">Proposed measure</th><th scope="col">Definition</th><th scope="col">Collection and review frequency</th></tr></thead><tbody><tr><th scope="row">Proposed registration quality</th><td>Count unique registrations meeting agreed verification checks. Report suspected duplicates awaiting review separately; do not count unresolved duplicates as verified.</td><td>Check daily during collection; summarise weekly.</td></tr><tr><th scope="row">Proposed recruitment coverage</th><td>Count recruitment by channel and agreed participant group. Show missing location and profile fields as counts and shares of all registrations; retain unknown categories. Multi-channel totals must identify overlaps.</td><td>Review weekly, with a dated outreach-change log.</td></tr><tr><th scope="row">Proposed teaching pathway</th><td>Count unique learners requesting teaching, matched, waiting for a suitable match, and starting at least one instructional session. State the observation date and cohort; these stages are not additive.</td><td>Update at each transition; summarise weekly.</td></tr><tr><th scope="row">Proposed attendance and skills</th><td>Attendance = sessions attended / sessions scheduled for each starting cohort. Skills = learners demonstrating an agreed assessed skill / all learners starting that cohort. Report numerator, denominator, assessment criteria and unassessed learners; completion review requires a full course cycle.</td><td>Record each session and assessment; review monthly and at course-cycle end.</td></tr><tr><th scope="row">Proposed follow-up and access</th><td>Missing follow-ups / all follow-ups due in the period; unresolved access needs / all recorded needs. Summarise voluntary feedback, number invited, number responding and themes, with accessible response routes.</td><td>Log as received; review weekly and at cohort follow-up.</td></tr><tr><th scope="row">Proposed unit costs</th><td>Document actual attributable costs and allocation rules for the same period/cohort. Divide by verified registrations, learners starting instruction, and learners demonstrating an agreed skill, respectively. Show each numerator and denominator; a zero denominator means not calculable.</td><td>Record expenditure when incurred; reconcile monthly and at pilot review.</td></tr></tbody></table></div><p>Proposed evidence outputs: a checked register with a duplicate-review log; recruitment and coverage summaries with an outreach-change log; learner matching and waiting lists; cohort attendance and skills summaries; and a review of access barriers, participant feedback and costs. Share only agreed aggregate reporting, with small-group disclosure risks reviewed.</p></section><section><h2>Resources and preparation before recruitment.</h2><p>This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p><ol><li>Co-design questions, consent and learning arrangements with people with disabilities.</li><li>Review existing data tools and discuss possible NDMIS alignment with the responsible technical team; agree definitions, permissions and stewardship before any data sharing.</li><li>Assess facilitator capacity, languages, devices, connectivity and accommodation barriers.</li><li>Obtain local cost estimates for outreach, staffing, teaching, infrastructure and access support.</li><li>Agree responsibilities, readiness criteria and a limited pilot protocol before recruitment.</li></ol><p>Agree who provides each resource and who owns collection, safeguarding, teaching and follow-up. A working demonstration does not establish operational readiness.</p></section><section class="proposal-sources"><h2>Sources and review dates.</h2><p>Historical achievements, reported priorities and our proposed activities are distinguished above. Methodological sources inform the proposal; they do not endorse it.</p><ul><li><a href="https://www.afro.who.int/news/neglect-inspiration-ayuba-gufwans-story">WHO: From neglect to inspiration</a> · 23 April 2019 · Reviewed 8 November 2026. <span>Historical profile of Gufwan’s mobility advocacy and education pathway.</span></li><li><a href="https://www.beautifulgatewheelchairs.org/">Beautiful Gate’s own account</a> · Undated · Reviewed 8 November 2026. <span>Organisation-reported cumulative reach; the page does not date the totals.</span></li><li><a href="https://www.crcna.org/news-and-events/news/entering-through-beautiful-gate">World Renew: Entering through the Beautiful Gate</a> · 22 November 2017 · Reviewed 8 November 2026. <span>Historical account of wheelchair production and outreach.</span></li><li><a href="https://www.thecable.ng/interview-why-we-proposed-allocating-10-of-government-interventions-to-pwds-by-ayuba-gufwan/">TheCable: Interview with Ayuba Gufwan</a> · 15 November 2025 · Reviewed 8 November 2026. <span>Gufwan’s stated priorities and initiatives, attributed to the interview.</span></li><li><a href="https://inclusivenews.com.ng/credible-disability-data-key-to-effective-planning-service-delivery-gufwan/">Inclusive News Network: Disability data and NDMIS workshop</a> · 4 November 2026 · Reviewed 8 November 2026. <span>Reporting on validation of revised KPIs and NDMIS data collection tools; does not verify deployment or this project’s integration.</span></li><li><a href="https://unhcr.github.io/Integrated-framework-household-survey/Sampling.html">UNHCR: Sampling</a> · Online guidance · Reviewed 8 November 2026. <span>Probability and non-probability approaches, including referral bias.</span></li><li><a href="https://www.worldbank.org/en/programs/lsms/sampling">World Bank: Sampling, Weighting &amp; Estimation</a> · Online guidance · Reviewed 8 November 2026. <span>Guidance for a justified survey design and inference.</span></li><li><a href="https://worldbank.github.io/dime-data-handbook/acquisition.html">DIME: Acquiring development data</a> · Online handbook · Reviewed 8 November 2026. <span>Data quality, documentation and confidential-data handling.</span></li><li><a href="https://www.washingtongroup-disability.com/implementation/implementation-guidelines/">Washington Group: Implementation guidelines</a> · Online guidance · Reviewed 8 November 2026. <span>Question selection and implementation for disability statistics.</span></li></ul></section></section></div></section>

<section id="static-about"><div class="showcase about-page"><section class="section public-page"><div class="site-page-heading"><div><h2>About.</h2><p>Two statisticians proposing a pathway from reliable data to accessible teaching.</p></div></div><div class="about-overview"><section><h2>About Impact Mosaic</h2><p>Impact Mosaic brings together a source-linked showcase of disability inclusion and a learning sandbox for practical skills.</p><p>Jerry Bannister Zachary and Strong propose to contribute recruitment design, data quality checks, coverage monitoring and evaluation. We are two statisticians with a working prototype.</p><p>Plateau is our proposed starting location for a limited pilot. Exact communities, eligibility, participant numbers and courses will be agreed during technical scoping.</p><p>The showcase is independent. The sandbox uses fictional participants and sample records to demonstrate learning, teaching and support.</p></section><section><h2>Learning with support</h2><p>Learners practise new skills, facilitators offer guidance, and Administration connects people with teaching and support.</p><p>Explore the sandbox with sample details to see how the roles work together.</p></section></div><section><h2>Our proposed statistical responsibilities</h2><p>Recruitment design, data quality checks, coverage monitoring and evaluation: agree who to reach, check records, identify missing groups and follow starting cohorts with explicit denominators.</p><p>This is an independent proposal. Community access, facilitators, funding, secure operational infrastructure and accommodation support remain to be secured. No endorsement, delivery partnership or access to existing beneficiary records is assumed.</p></section><section class="about-credits"><h2>Project contributors</h2><ul aria-label="Project contributors"><li>Jerry Bannister Zachary</li><li>Strong</li></ul></section></section></div></section><footer><a href="https://deerflow.tech" target="_blank" rel="noreferrer">Created By Deerflow</a></footer></main></noscript><!-- static-story:end -->
